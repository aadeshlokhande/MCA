<!DOCTYPE html>
<html>
<head>
    <title>Bootstrap Alert with JS</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
</head>
<body>

<div class="container mt-5">
    <button class="btn btn-success" onclick="showAlert()">
        Show Alert
    </button>

    <div id="myAlert" class="alert alert-warning mt-3 d-none">
        This is a Bootstrap alert message.
    </div>
</div>

<script>
    function showAlert() {
        alert("this is the end")
    }
</script>

</body>
</html>
